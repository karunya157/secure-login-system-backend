spring.application.name=backend
server.port=${PORT:8081}

# MySQL database (Railway dynamic configuration with localhost fallback)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:jwtauthdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:12345678}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT configuration
# 256-bit+ secret, base64 encoded. Replace with a securely generated secret in production.
app.jwt.secret=${JWT_SECRET:ZmMyNWM4ZmQ0YjE3ZjQxOTNkNGE1ZDY2ZjA4YzY2ZmZjMjVjOGZkNGIxN2Y0MTkzZDRhNWQ2NmYwOGM2NmY=}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Frontend origin allowed for CORS
app.cors.allowed-origins=*

